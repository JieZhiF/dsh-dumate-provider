name: publish

# Publish to npm from a tag, so the machine that cuts the release never needs
# to reach npmjs.com (which Cloudflare blocks in some networks). The registry
# API itself is reachable from the runner.
#
# Setup, once:
#   repo → Settings → Secrets and variables → Actions → New repository secret
#   name: NPM_TOKEN
#   value: an npm "Automation" token (bypasses 2FA prompts)
#
# Then:
#   git tag v1.5.1 && git push origin v1.5.1
#
# The tag must match package.json "version" (v1.5.1 → 1.5.1); the job fails
# fast if they disagree, so a mismatched tag cannot publish the wrong number.

on:
  push:
    tags: ['v*']
  # Manual run for a re-publish after a flake. Tags are the normal path.
  workflow_dispatch:

permissions:
  contents: read
  # --provenance mints a short-lived OIDC token; without this the publish step
  # fails with "provenance generation failed" before anything is uploaded.
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Check tag matches package.json
        run: |
          node -e '
            const version = require("./package.json").version
            const ref = process.env.GITHUB_REF_TYPE === "tag" ? process.env.GITHUB_REF_NAME : ""
            if (ref === "") { console.log("manual run, publishing " + version); process.exit(0) }
            if (ref !== "v" + version) { console.error("tag " + ref + " does not match package.json " + version); process.exit(1) }
          '

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      # Without the secret the job skips publishing instead of failing the tag:
      # Secrets cannot be read in `if:`, so they are lifted into env first.
      - name: Check for a token
        id: token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN is not set; skipping the npm publish step."
          fi

      - name: Publish
        if: steps.token.outputs.present == 'true'
        # --provenance signs the package with this workflow's identity, which is
        # the point of publishing from CI rather than a laptop. It needs the
        # job-level `id-token: write` below; without it npm aborts before upload.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          node -e 'console.log("published " + require("./package.json").name + "@" + require("./package.json").version)' >> "$GITHUB_STEP_SUMMARY"